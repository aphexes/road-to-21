<style>
/* Layout: one phone-width column; sticky title bar on top, four-tab bar fixed at the bottom; session cards are the only raised surfaces. */

    --run: #3987e5; --gym: #d95926; --walk: #199e70; --rest: #7d8a92;

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; }

<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/* ---------- Program data and pure helpers (no DOM) ---------- */
const START = '2026-10-12';
const WEEKS = 16;
const TZID = 'Asia/Hong_Kong';

const pad = n => String(n).padStart(2, '0');
const toYmd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromYmd = s => { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addDays = (s, n) => { const d = fromYmd(s); d.setDate(d.getDate() + n); return toYmd(d); };
const diffDays = (a, b) => Math.round((fromYmd(a) - fromYmd(b)) / 864e5);
const mondayOf = s => addDays(s, -((fromYmd(s).getDay() + 6) % 7));
const END = addDays(START, WEEKS * 7 - 1);
const weekOf = s => { const n = Math.floor(diffDays(s, START) / 7) + 1; return n >= 1 && n <= WEEKS ? n : 0; };
const weekStart = n => addDays(START, (n - 1) * 7);

const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const fmtShort = s => { const d = fromYmd(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtDM = s => { const d = fromYmd(s); return d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtRange = (a, b) => { const x = fromYmd(a), y = fromYmd(b); return x.getMonth() === y.getMonth() ? x.getDate() + '–' + y.getDate() + ' ' + MON[y.getMonth()] : fmtDM(a) + ' – ' + fmtDM(b); };

const PHASES = [
  { id: 'base', name: 'Base', from: 1, to: 3, easy: '6:20–7:00', long: '7 → 10 km',
    focus: 'Build the habit: three, then four easy runs a week. Every run stays under 165 bpm, even when late-morning heat makes that feel slow.' },
  { id: 'build', name: 'Build', from: 4, to: 7, easy: '6:00–6:30', long: '12 → 16 km',
    focus: 'The long run grows to 10 miles. One steady session a week at half-marathon effort.' },
  { id: 'speed', name: 'Speed', from: 8, to: 11, easy: '5:50–6:20', long: '12 → 16 km',
    focus: '400 m and 1 km repeats bring back 4:30/km. 5K time trial on 25 December.' },
  { id: 'half', name: 'Half build', from: 12, to: 15, easy: '5:45–6:15', long: '16 → 20 km',
    focus: 'The long run reaches 20 km. Tempo work at half-marathon pace, 5:20–5:30/km.' },
  { id: 'taper', name: 'Taper and half', from: 16, to: 16, easy: '5:45–6:15', long: '21.1 km',
    focus: 'Volume drops and the legs freshen, then 21.1 km on Sunday 31 January.' },
];
const phaseOf = n => PHASES.find(p => n >= p.from && n <= p.to) || null;

const HR_ZONES = [
  { z: 'Z1', lo: 0, hi: 130, use: 'Walking, warm-up' },
  { z: 'Z2', lo: 131, hi: 162, use: 'Easy and long runs' },
  { z: 'Z3', lo: 163, hi: 178, use: 'Steady, half-marathon effort' },
  { z: 'Z4', lo: 179, hi: 194, use: '1 km repeats, 5K effort' },
  { z: 'Z5', lo: 195, hi: 203, use: 'Final sprint only' },
];

/* ---------- session builders ---------- */
const paceMid = r => { const m = r.split('–').map(x => { const a = x.split(':').map(Number); return a[0] + a[1] / 60; }); return (m[0] + m[1]) / 2; };
const WU_EASY = ['5 min brisk walk, then leg swings and ankle circles', 'Run the first kilometre slower than the rest'];
const CD = ['5 min walk', 'Calves, hips and quads: 30 s each side'];
const WU_HARD = km => [km + ' km easy jog', 'Leg swings, then 4 × 20 s strides with a walk back'];

function easyRun(km, p, o) {
  o = o || {};
  const main = [km + ' km easy with heart rate under 165', 'If it passes 170, walk 60 s and restart slower'];
  if (o.strides) main.push(o.strides + ' × 20 s strides to finish: fast but relaxed, walk back between');
  return { type: 'run', kind: 'easy', title: o.title || 'Easy run', km, mins: Math.round(km * paceMid(p.easy)) + (o.strides ? 4 : 0) + 10,
    target: { pace: p.easy + ' /km', hr: 'Under 165 bpm', effort: 'You can speak in full sentences' },
    blocks: [{ label: 'Warm-up', lines: WU_EASY }, { label: 'Main set', lines: main }, { label: 'Cool-down', lines: CD }],
    notes: o.notes || [], kcal: Math.round(km * 72) };
}
function longRun(km, p, o) {
  o = o || {};
  const main = [];
  if (o.finish) {
    main.push((km - o.finish) + ' km easy with heart rate under 165');
    main.push('Last ' + o.finish + ' km at ' + o.finishAt);
  } else main.push(km + ' km easy with heart rate under 165');
  main.push('Walk 60 s whenever heart rate passes 172, then carry on');
  const notes = [o.hot
    ? 'Route: Bowen Road while late mornings are still hot. It is flat, shaded and about 4 km end to end, so run it out and back. The harbourfront has almost no shade before noon.'
    : 'Route: east along the harbourfront from Sun Yat Sen Memorial Park past Central Piers, Tamar and Wan Chai. Turn around at half distance. Bowen Road is the flat, shaded alternative.'];
  if (km >= 14) notes.push('Carry 500 mL Pocari Sweat and sip from 30 minutes in.');
  else if (km >= 10 || o.hot) notes.push('Carry water. Drink at the turnaround.');
  if (o.notes) notes.push.apply(notes, o.notes);
  return { type: 'run', kind: 'long', title: o.title || 'Long run', km, mins: Math.round(km * paceMid(p.easy)) + 10,
    target: { pace: p.easy + ' /km', hr: 'Under 165 bpm', effort: 'Comfortable all the way; finish feeling you could add 2 km' },
    blocks: [{ label: 'Warm-up', lines: WU_EASY }, { label: 'Main set', lines: main }, { label: 'Cool-down', lines: CD.concat(['Eat meal 2 within an hour']) }],
    notes, kcal: Math.round(km * 72) };
}
function quality(title, km, mins, target, wu, main, cdKm, notes) {
  return { type: 'run', kind: 'quality', title, km, mins,
    target, blocks: [{ label: 'Warm-up', lines: WU_HARD(wu) }, { label: 'Main set', lines: main }, { label: 'Cool-down', lines: [cdKm + ' km very easy jog', 'Calves, hips and quads: 30 s each side'] }],
    notes: notes || [], kcal: Math.round(km * 72) };
}
const steady = (segs, total, p) => quality('Steady run', total, Math.round(total * 5.9) + 6,
  { pace: '5:30–5:50 /km', hr: '170–180 bpm', effort: 'Half-marathon effort: short phrases only' },
  2, [segs, 'Hold the effort even; do not chase pace in the heat'], 1.5,
  ['If heart rate passes 183, ease off until it settles.']);
const reps400 = n => quality(n + ' × 400 m', 8, 50,
  { pace: '1:44–1:48 per 400 m (4:20–4:30 /km)', hr: 'Reaches 185–192 by the last reps', effort: 'Fast and smooth, never a sprint' },
  2, [n + ' × 400 m at 1:44–1:48', '200 m slow jog between reps (about 90 s)', 'Use the flat promenade stretch by Sun Yat Sen Memorial Park'], 1.4,
  ['Stop the set if a rep is slower than 1:52. That is the session done.']);
const reps1k = (n, pace, total) => quality(n + ' × 1 km', total, Math.round(total * 5.6) + 6,
  { pace: pace + ' /km', hr: '180–192 bpm on the reps', effort: '5K to 10K effort: controlled and hard' },
  2, [n + ' × 1 km at ' + pace + ' /km', '2 min walk-jog between reps', 'Aim for the same split every rep'], 1.2,
  ['The target is even splits. If the last rep is your fastest, start faster next week.']);
const tempo = (segs, total) => quality('Half-pace tempo', total, Math.round(total * 5.6) + 6,
  { pace: '5:20–5:30 /km', hr: '172–182 bpm', effort: 'Goal half-marathon pace: steady and controlled' },
  2, [segs, 'Lock into pace within the first 500 m and hold it'], 1.5,
  ['This is rehearsal for 31 January. Practise the pace until it feels automatic.']);
const hrCheck = n => ({ type: 'run', kind: 'test', title: 'Heart-rate check: 5 km at 5:00/km', km: 7.5, mins: 48,
  target: { pace: '5:00 /km, even', hr: 'Record the average', effort: 'Hold the pace exactly; the heart rate is the result' },
  blocks: [{ label: 'Warm-up', lines: WU_HARD(1.5) },
    { label: 'Main set', lines: ['5 km at exactly 5:00 /km (25:00)', 'Press lap at the start and end so the watch gives the average heart rate for the 5 km alone'] },
    { label: 'Cool-down', lines: ['1 km very easy jog', 'Write the average heart rate in your Strava note'] }],
  notes: [n === 1 ? 'Baseline. Expect an average near 180–185 bpm today.' : 'Goal: an average of 178 bpm or lower, which puts 5:00/km in Zone 3.'], kcal: 540 });
const timeTrial = () => ({ type: 'run', kind: 'test', title: '5K time trial', km: 8.5, mins: 52,
  target: { pace: '4:30–4:40 /km', hr: 'Climbs to 195+', effort: 'All you have, spread evenly' },
  blocks: [{ label: 'Warm-up', lines: WU_HARD(2) },
    { label: 'Main set', lines: ['5 km all-out on the promenade', 'First kilometre no faster than 4:35. On 10 October you opened at 4:28 and faded to 5:13', 'Kilometres 2–4 hold pace, then empty the tank in the last one'] },
    { label: 'Cool-down', lines: ['1.5 km very easy jog', 'Calves, hips and quads: 30 s each side'] }],
  notes: ['Target 23:00 or faster. Stretch target 22:30, which matches your best.', 'Have the top-up 30–60 minutes before. Nothing heavier.'], kcal: 612 });
const race = () => ({ type: 'run', kind: 'race', title: 'Half marathon', km: 21.1, mins: 118,
  target: { pace: '5:20–5:35 /km for a 1:53–1:58 finish', hr: '170–180 bpm until 16 km', effort: 'Patient for 16 km, then race the last 5' },
  blocks: [{ label: 'Before', lines: ['Wake 2.5 hours early. Eat meal 1 (the oats, with banana), then sip 500 mL water', '10 min easy jog and 3 strides'] },
    { label: 'The run', lines: ['Kilometres 1–5 at 5:35 /km. It should feel too easy', 'Kilometres 6–16 at 5:25–5:30 /km', 'Kilometres 17–21.1: whatever is left', 'Pocari Sweat: a few mouthfuls every 20 minutes from 30 min in'] },
    { label: 'After', lines: ['10 min walk', 'Milk and meal 2 within the hour'] }],
  notes: ['Route: harbourfront out and back, twice. Start by 07:00 while it is cool and quiet.', 'If this is a class Sunday, swap it with Friday in the Week view.'], kcal: 1520 });

const sqLadder = n => n <= 2 ? '50 / 60 / 70 / 70 kg' : n <= 7 ? '60 / 70 / 80 / 80 kg' : n <= 11 ? '60 / 70 / 80 / 85 kg' : n <= 13 ? '60 / 70 / 80 / 80 kg' : '60 / 70 / 80 kg';
const sqSets = n => n >= 14 ? '3 × 12' : '4 × 12';
const step = (n, arr) => arr[n <= 3 ? 0 : n <= 7 ? 1 : n <= 11 ? 2 : 3];
const GYM_NOTE = 'Add 2.5 kg once all four sets reach 12 clean reps. Loads come from your Strava notes; use the nearest plate or stack setting.';

function push(n, o) {
  o = o || {};
  const main = [];
  if (!o.light) main.push(['Back squat', sqSets(n), sqLadder(n)]);
  main.push(['Bench press', '4 × 12', step(n, ['40', '42.5', '45', '47.5']) + ' kg']);
  main.push(['Military press', '4 × 12', step(n, ['25', '27.5', '27.5', '30']) + ' kg']);
  main.push(['Incline dumbbell bench press', '4 × 12', step(n, ['12.5', '15', '15', '17.5']) + ' kg each']);
  main.push(['Lateral raise + cable chest fly', '4 × 12 superset', step(n, ['5 kg / 20 lb', '5 kg / 20 lb', '7.5 kg / 25 lb', '7.5 kg / 25 lb'])]);
  main.push(['Seated dumbbell triceps extension', '4 × 12', step(n, ['15', '17.5', '17.5', '20']) + ' kg']);
  const notes = [GYM_NOTE];
  if (o.light) notes.unshift('Race week: no squats, and stop every set 3 reps short.');
  else if (n >= 12) notes.unshift('Squat load holds through the half build. Keep the reps crisp.');
  return { type: 'gym', kind: 'push', title: 'Push', mins: o.light ? 45 : 60,
    target: { load: 'Last 2 reps of each set should be hard', effort: '60–90 s rest between sets' },
    blocks: [{ label: 'Warm-up', lines: ['5 min bike or rower', '1 × 12 squat and press with the empty bar'] }, { label: 'Main set', lines: main }, { label: 'Cool-down', lines: ['Chest, shoulder and hip-flexor stretch: 30 s each'] }],
    notes, kcal: o.light ? 160 : 220 };
}
function pull(n, o) {
  o = o || {};
  const main = [];
  if (!o.noDead) main.push(['Deadlift', sqSets(n), sqLadder(n)]);
  main.push(['Pull-ups', '4 sets', 'Stop 1–2 reps before failure']);
  main.push(['Lat pulldown', '4 × 12', step(n, ['50', '50', '55', '55']) + ' kg']);
  main.push(['Pendlay row', '4 × 12', step(n, ['50', '55', '60', '60']) + ' kg']);
  main.push(['Single-arm dumbbell row', '4 × 12 each', step(n, ['20', '22.5', '25', '25']) + ' kg']);
  main.push(['Barbell curl', '4 × 12', step(n, ['20', '20', '22.5', '22.5']) + ' kg']);
  const notes = [GYM_NOTE];
  if (o.noDead) notes.unshift(o.why || 'No deadlifts today.');
  return { type: 'gym', kind: 'pull', title: 'Pull', mins: o.noDead ? 50 : 60,
    target: { load: 'Last 2 reps of each set should be hard', effort: '60–90 s rest between sets' },
    blocks: [{ label: 'Warm-up', lines: ['5 min rower', '1 × 12 deadlift with the empty bar, 1 × 10 scapular pull-ups'] }, { label: 'Main set', lines: main }, { label: 'Cool-down', lines: ['Lats, hamstrings and forearms: 30 s each'] }],
    notes, kcal: o.noDead ? 180 : 220 };
}
function core(n, o) {
  o = o || {};
  if (o.light) return { type: 'gym', kind: 'core', title: 'Core, light', mins: 20,
    target: { load: 'Activation only', effort: 'Nothing to failure' },
    blocks: [{ label: 'Main set', lines: [['Resistance band trunk rotation', '2 × 15 each', 'Light band'], ['Captain\u2019s chair leg raise', '2 × 10', 'Bodyweight'], ['Side plank', '2 × 30 s each', 'Bodyweight'], ['Single-leg calf raise', '2 × 12 each', 'Bodyweight']] }],
    notes: ['The half is tomorrow. Leave the gym fresher than you arrived.'], kcal: 70 };
  const main = [
    ['Sidestep medicine ball toss', '4 × 6 each', '6 kg'],
    ['Dumbbell wood chop', '4 × 12 each', step(n, ['15', '15', '17.5', '17.5']) + ' kg'],
    ['Captain\u2019s chair leg raise', '4 × ' + (n <= 7 ? '12' : '15'), 'Bodyweight'],
    ['Resistance band trunk rotation', '4 × 15 each', 'Thick band'],
    ['Hanging leg raise', '3 sets', '10–15 reps'],
  ];
  const knee = [
    ['Tiptoe squat', '2 × 15', 'Bodyweight'],
    ['Single-leg calf raise', '3 × 15 each', 'Last set with a bent knee'],
    ['Dumbbell lunge raise', '2 × 10 each', '10 kg each'],
  ];
  const fin = n >= 13 && n <= 15
    ? ['4 rounds: 1 min mini crunches, 1 min Russian twists, 1 min plank, 1 min rest']
    : ['4 rounds: 1 min mini crunches, 1 min Russian twists, 1 min half burpees, 1 min rest'];
  return { type: 'gym', kind: 'core', title: 'Core', mins: 55,
    target: { load: 'Controlled reps, full range', effort: '45–60 s rest between sets' },
    blocks: [{ label: 'Main set', lines: main }, { label: 'Knee and calf block', lines: knee }, { label: 'Finisher', lines: fin }],
    notes: ['The knee and calf block is the part that protects your running. Do it even on a short day.'], kcal: 200 };
}
const walk = m => ({ type: 'walk', kind: 'incline', title: 'Incline walk', mins: m, km: +(m / 10).toFixed(1),
  target: { pace: '15% at 6.0 km/h', hr: '150–170 bpm', effort: 'Hands off the rails' },
  blocks: [{ label: 'Warm-up', lines: ['2 min at 8% and 5 km/h'] }, { label: 'Main set', lines: [m + ' min at 15% and 6.0 km/h', 'If heart rate passes 172, drop to 5.5 km/h'] }, { label: 'Cool-down', lines: ['2 min flat at 4.5 km/h', 'Calf stretch: 30 s each side'] }],
  notes: ['Straight after lifting, as you have always done it. This is low-impact aerobic work that spares your knee.'], kcal: Math.round(m * 9.5) });
const rest = (title, lines, notes) => ({ type: 'rest', kind: 'rest', title: title || 'Rest day', mins: 0,
  target: null, blocks: [{ label: 'Today', lines: lines || ['No training', 'A 20–30 min easy walk is fine', 'Sleep is the session: aim for 8 hours'] }],
  notes: notes || ['Free Sunday? A hike fits here every week or two. If you hike, skip Saturday\u2019s short run that week and keep the pace social.'], kcal: 0 });

/* ---------- the 16 weeks ---------- */
function buildWeek(n) {
  const p = phaseOf(n);
  const W = n === 16 ? 30 : (n === 8 || n === 11) ? 50 : 40;
  const d = { mon: [push(n), walk(W)], wed: [pull(n), walk(W)], sun: [rest()] };
  const E = (km, o) => easyRun(km, p, o), L = (km, o) => longRun(km, p, Object.assign({ hot: n <= 6 }, o));
  const sat = km => [core(n), E(km, { title: 'Short easy run', notes: ['Run after the core session, or later in the day.'] })];
  switch (n) {
    case 1: d.tue = [E(5, { notes: ['First run back after Saturday\u2019s hard 5K. Slow is the point.'] })]; d.thu = [E(5, { strides: 4 })]; d.fri = [L(7)]; d.sat = [core(n)]; break;
    case 2: d.tue = [E(5, { strides: 4 })]; d.thu = [E(5)]; d.fri = [L(8.5)]; d.sat = sat(3); break;
    case 3: d.tue = [E(6, { strides: 6 })]; d.thu = [E(5)]; d.fri = [L(10, { notes: ['Checkpoint: 10 km is back.'] })]; d.sat = sat(4); break;
    case 4: d.tue = [steady('3 km steady at 170–180 bpm', 6.5, p)]; d.thu = [E(6)]; d.fri = [L(12)]; d.sat = sat(4); break;
    case 5: d.tue = [steady('4 km steady at 170–180 bpm', 7.5, p)]; d.thu = [E(6)]; d.fri = [L(14)]; d.sat = sat(4); break;
    case 6: d.tue = [hrCheck(1)]; d.thu = [E(5)]; d.fri = [L(11, { notes: ['Cutback week. Shorter on purpose so next Friday\u2019s 10 miles lands well.'] })]; d.sat = sat(4); break;
    case 7: d.tue = [steady('2 × 3 km steady at 170–180 bpm, 2 min walk-jog between', 9.5, p)]; d.thu = [E(6)]; d.fri = [L(16.1, { title: 'Long run: 10 miles', notes: ['Checkpoint: 10 miles. Last December you ran this at 4:54/km; today is about finishing fresh.'] })]; d.sat = sat(4); break;
    case 8: d.tue = [reps400(8)]; d.thu = [E(6)]; d.fri = [L(12)]; d.sat = sat(4); break;
    case 9: d.tue = [reps1k(5, '4:35–4:40', 9.5)]; d.thu = [E(6, { strides: 4 })]; d.fri = [L(14, { finish: 3, finishAt: '5:30–5:45 /km (steady)' })]; d.sat = sat(5); break;
    case 10: d.tue = [reps1k(6, '4:30–4:35', 10.5)]; d.thu = [E(6, { strides: 4 })]; d.fri = [L(16)]; d.sat = sat(5); break;
    case 11: d.tue = [L(12, { title: 'Midweek long run', notes: ['Moved to Tuesday so Friday\u2019s time trial gets fresh legs.'] })]; d.thu = [E(5, { strides: 4, notes: ['Keep it short and easy. The time trial is tomorrow.'] })]; d.fri = [timeTrial()]; d.sat = sat(4); break;
    case 12:
      d.tue = [tempo('5 km at 5:20–5:30 /km', 8.5)];
      d.wed = [pull(n, { noDead: true, why: 'No deadlifts: the long run is tomorrow.' }), walk(W)];
      d.thu = [L(16, { notes: ['Thursday this week, so New Year\u2019s Day stays free.'] })];
      d.fri = [rest('Rest day', ['New Year\u2019s Day: no training', 'A 20–30 min easy walk is fine'], ['The long run moved to Thursday. Sunday carries an extra easy run.'])];
      d.sat = sat(5); d.sun = [E(6, { notes: ['Replaces the usual Sunday rest, because Friday was off.'] })]; break;
    case 13: d.tue = [tempo('3 × 2 km at 5:20–5:30 /km, 2 min walk-jog between', 10)]; d.thu = [E(6)]; d.fri = [L(18)]; d.sat = sat(5); break;
    case 14: d.tue = [tempo('6 km at 5:20–5:30 /km', 9.5)]; d.thu = [E(7)]; d.fri = [L(20, { finish: 4, finishAt: '5:20–5:30 /km (half pace)', notes: ['Checkpoint: 20 km. The biggest run of the plan.', 'Practise race fuelling: Pocari every 20 minutes.'] })]; d.sat = sat(4); break;
    case 15: d.tue = [hrCheck(2)]; d.thu = [E(6, { strides: 4 })]; d.fri = [L(12, { notes: ['Taper has started. Resist adding distance.'] })]; d.sat = sat(4); break;
    case 16:
      d.mon = [push(n, { light: true }), walk(W)];
      d.tue = [quality('Race-pace sharpener', 6.5, 40, { pace: '5:20–5:30 /km on the reps', hr: '172–182 bpm on the reps', effort: 'Smooth; finish wanting more' }, 2, ['3 × 1 km at 5:20–5:30 /km', '90 s walk-jog between reps'], 1, ['Last hard running before Sunday.'])];
      d.wed = [pull(n, { noDead: true, why: 'Race week: no deadlifts, and stop every set 3 reps short.' }), walk(W)];
      d.thu = [E(4, { strides: 4 })];
      d.fri = [rest('Rest day', ['No training', 'Eat normally, with an extra half pack of noodles at dinner', 'Lay out kit, shoes and Pocari for Sunday'], ['Two days out. Rest is the work.'])];
      d.sat = [core(n, { light: true }), E(3, { title: 'Shakeout run', strides: 3, notes: ['Loosen the legs. Nothing more.'] })];
      d.sun = [race()]; break;
  }
  return [d.mon, d.tue, d.wed, d.thu, d.fri, d.sat, d.sun];
}

const PROGRAM = {};
(function () {
  for (let n = 1; n <= WEEKS; n++) {
    const days = buildWeek(n), ws = weekStart(n);
    days.forEach((list, i) => {
      const date = addDays(ws, i);
      list.forEach((s, j) => { s.id = date + ':' + j; s.origin = date; });
      PROGRAM[date] = list;
    });
  }
})();

const weekKm = n => { let t = 0; for (let i = 0; i < 7; i++) (PROGRAM[addDays(weekStart(n), i)] || []).forEach(s => { if (s.type === 'run') t += s.km; }); return Math.round(t * 10) / 10; };

const BENCHMARKS = [
  { date: '2026-10-23', label: '8.5 km without stopping', goal: 'Heart rate under 165 throughout' },
  { date: '2026-10-30', label: '10 km long run', goal: 'Your first 10K since the March runs in Shanghai' },
  { date: '2026-11-17', label: '5 km at 5:00/km: heart-rate check 1', goal: 'Baseline, likely 180–185 bpm' },
  { date: '2026-11-27', label: '10 miles', goal: 'Finish feeling you could add 2 km' },
  { date: '2026-12-25', label: '5K time trial', goal: '23:00 or faster; stretch 22:30' },
  { date: '2027-01-15', label: '20 km long run', goal: 'Last 4 km at half pace' },
  { date: '2027-01-19', label: '5 km at 5:00/km: heart-rate check 2', goal: 'Average 178 bpm or lower (Zone 3)' },
  { date: '2027-01-31', label: 'Half marathon', goal: 'Under 1:58; stretch 1:53' },
];
const WEIGHT_START = 72.5, WEIGHT_GOAL = 68.5;
const weightTarget = date => { const t = Math.max(0, Math.min(1, diffDays(date, START) / diffDays(END, START))); return Math.round((WEIGHT_START + (WEIGHT_GOAL - WEIGHT_START) * t) * 10) / 10; };

const fmtQ = q => { const w = Math.floor(q), f = q - w; return f === 0.5 ? (w ? w + '½' : '½') : String(q); };
const qtyAt = (q, ix) => Array.isArray(q) ? q[ix] : q;
function mealAt(m, ix, lessEggs) {
  let k = 0, p = 0; const lines = [];
  m.items.forEach(it => {
    let q = qtyAt(it[1], ix); const f = FOOD[it[0]];
    if (lessEggs && it[0] === 'egg') q = Math.max(1, q - lessEggs);
    if (!q) return;
    k += f[0] * q; p += f[1] * q;
    if (it[2]) lines.push(it[2].replace('{q}', fmtQ(q)));
  });
  if (m.fixed) { k = m.fixed[ix][0]; p = m.fixed[ix][1]; }
  return { name: m.name, mins: m.mins, how: m.how, when: m.when, kcal: Math.round(k / 5) * 5, p: Math.round(p), lines };
}

const SLOT_NAMES = ['Meal 1 · straight after training', 'Meal 2 · by 20:00'];
function dayMeals(date, list) {
  const ix = TIER_IX[dayTier(list)], menu = MENU[fromYmd(date).getDay()];
  const sat = fromYmd(date).getDay() === 6;
  const shake = needsShake(list);
  const out = menu.map((id, i) => Object.assign({ slot: sat && i === 0 ? 'Meal 1 · around noon, after class' : SLOT_NAMES[i], id }, mealAt(MEALS[id], ix, shake && i === 0 && ix < 2 ? 2 : 0)));
  if (shake) out.splice(sat ? 1 : 0, 0, Object.assign({ slot: sat ? 'After the core session' : 'After training', id: 'shake' }, mealAt(ADDONS.shake, ix)));
  else if (needsMilk(list)) out.splice(1, 0, Object.assign({ slot: 'After the run', id: 'milk' }, mealAt(ADDONS.milk, ix)));
  if (needsTopUp(list)) out.unshift(Object.assign({ slot: 'Before the run', id: 'topUp' }, mealAt(ADDONS.topUp, ix)));
  return out;
}

const OLD_TIMES = { gym: '11:30', run: '18:30', long: '18:00', sat: '15:00', race: '07:00' };
function dayStartTime(date, list, times) {
  const first = list.find(s => s.type !== 'rest');
  if (!first) return null;
  if (list.some(s => s.kind === 'race')) return times.race;
  if (fromYmd(date).getDay() === 6) return times.sat;
  if (first.type === 'gym' || first.type === 'walk') return times.gym;
  return first.kind === 'long' ? times.long : times.run;
}
/* returns [{s, start:'HH:MM', end:'HH:MM'}] for non-rest sessions */
function daySchedule(date, list, times) {
  const t0 = dayStartTime(date, list, times);
  if (!t0) return [];
  let m = +t0.slice(0, 2) * 60 + +t0.slice(3, 5);
  const hm = x => pad(Math.floor(x / 60) % 24) + ':' + pad(x % 60);
  const out = [];
  list.forEach(s => { if (s.type === 'rest') return; const e = m + (s.mins || 30); out.push({ s, start: hm(m), end: hm(Math.min(e, 23 * 60 + 59)) }); m = e + 10; });
  return out;
}
const lineText = l => Array.isArray(l) ? l[0] + ': ' + l[1] + (l[2] ? ', ' + l[2] : '') : l;
function sessionSummary(s) {

  if (s.type === 'walk') return 'Incline walk ' + s.mins + ' min';
  if (s.type === 'gym') return s.title + ' session';
  return s.title;
}

  /* ---------- charts ---------- */
  const topRound = (x, y, w, h, r) => { r = Math.min(r, h, w / 2); return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z'; };
  function weekDoneKm(n) { let t = 0; for (let i = 0; i < 7; i++) PROGRAM[addDays(weekStart(n), i)].forEach(s => { if (s.type === 'run' && isDone(s)) t += s.km; }); return Math.round(t * 10) / 10; }
  function volumeChart() {
    const Wd = 340, H = 176, L = 26, R = 6, T = 16, B = 38, pw = Wd - L - R, ph = H - T - B, band = pw / WEEKS, bw = 12, max = 44, cur = weekOf(realToday());

    [0, 10, 20, 30, 40].forEach(v => { g += '<line class="grid" x1="' + L + '" x2="' + (Wd - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
    let peak = 1; for (let n = 2; n <= WEEKS; n++) if (weekKm(n) > weekKm(peak)) peak = n;
    for (let n = 1; n <= WEEKS; n++) {
      const km = weekKm(n), dn = Math.min(weekDoneKm(n), km), cx = L + band * (n - .5), x = cx - bw / 2, ws = weekStart(n);
      g += '<rect class="hit" tabindex="0" role="img" aria-label="Week ' + n + ', ' + fmtRange(ws, addDays(ws, 6)) + ': ' + km + ' km planned, ' + dn + ' km done" data-tip="Week ' + n + ' · ' + fmtRange(ws, addDays(ws, 6)) + '" data-tip2="' + km + ' km planned · ' + dn + ' km done" x="' + (cx - band / 2) + '" y="' + T + '" width="' + band + '" height="' + (ph + 16) + '"/>' +
        '<g class="b"><path class="bar" d="' + topRound(x, y(km), bw, y(0) - y(km), 4) + '"/>' + (dn > 0 ? '<path class="bar dn" d="' + topRound(x, y(dn), bw, y(0) - y(dn), dn >= km ? 4 : 0) + '"/>' : '') + '</g>' +
        '<text x="' + cx + '" y="' + (H - B + 14) + '" text-anchor="middle"' + (n === cur ? ' class="lbl"' : '') + '>' + n + '</text>';
      if (n === peak || n === cur) g += '<text class="lbl" x="' + cx + '" y="' + (y(km) - 5) + '" text-anchor="middle">' + km + '</text>';
      rows += '<tr><td>' + n + '</td><td>' + fmtRange(ws, addDays(ws, 6)) + '</td><td>' + phaseOf(n).name + '</td><td>' + km + '</td><td>' + dn + '</td></tr>';
    }
    PHASES.forEach(p => { const x0 = L + band * (p.from - 1), x1 = L + band * p.to; g += '<line class="grid" x1="' + (x0 + 2) + '" x2="' + (x1 - 2) + '" y1="' + (H - 16) + '" y2="' + (H - 16) + '"/><text x="' + ((x0 + x1) / 2) + '" y="' + (H - 3) + '" text-anchor="middle">' + (p.id === 'taper' ? 'Taper' : p.name) + '</text>'; });
    return '<div class="legend"><span><i></i>Planned km</span><span><i class="dn"></i>Done</span></div><div class="chart"><svg viewBox="0 0 ' + Wd + ' ' + H + '" role="group" aria-label="Running distance by week">' + g + '</svg></div>' +
      '<details class="bd"><summary>Show as a table' + icon('right') + '</summary><div class="scroll"><table class="tv"><thead><tr><th>Week</th><th>Dates</th><th>Phase</th><th>Planned km</th><th>Done km</th></tr></thead><tbody>' + rows + '</tbody></table></div></details>';
  }
  function weightChart() {
    const Wd = 340, H = 160, L = 30, R = 46, T = 12, B = 24, pw = Wd - L - R, ph = H - T - B, span = diffDays(END, START);
    const pts = Object.keys(S.user.weights).sort().map(d => ({ d, v: S.user.weights[d], x: diffDays(d, START) })).filter(p => p.x >= -14 && p.x <= span + 14);
    const vals = pts.map(p => p.v).concat([WEIGHT_START, WEIGHT_GOAL]);
    const lo = Math.floor(Math.min.apply(null, vals) - .4), hi = Math.ceil(Math.max.apply(null, vals) + .4);
    const x = v => L + Math.max(0, Math.min(1, v / span)) * pw, y = v => T + ph - (v - lo) / (hi - lo) * ph;
    let g = '';
    for (let v = lo; v <= hi; v++) g += '<line class="grid" x1="' + L + '" x2="' + (L + pw) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    [['2026-10-12', 'Oct'], ['2026-11-01', 'Nov'], ['2026-12-01', 'Dec'], ['2027-01-01', 'Jan']].forEach(m => { g += '<text x="' + x(diffDays(m[0], START)) + '" y="' + (H - 6) + '">' + m[1] + '</text>'; });
    g += '<line x1="' + x(0) + '" y1="' + y(WEIGHT_START) + '" x2="' + x(span) + '" y2="' + y(WEIGHT_GOAL) + '" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round"/><text x="' + (x(span) + 6) + '" y="' + (y(WEIGHT_GOAL) + 4) + '">' + WEIGHT_GOAL + ' kg</text>';
    if (pts.length) {
      g += '<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' + pts.map(p => x(p.x) + ',' + y(p.v)).join(' ') + '"/>';
      pts.forEach((p, i) => {
        g += '<circle cx="' + x(p.x) + '" cy="' + y(p.v) + '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>' +
          '<circle class="hit" tabindex="0" role="img" aria-label="' + fmtShort(p.d) + ': ' + p.v + ' kg" data-tip="' + p.v.toFixed(1) + ' kg" data-tip2="' + fmtShort(p.d) + ' · target ' + weightTarget(p.d).toFixed(1) + ' kg" cx="' + x(p.x) + '" cy="' + y(p.v) + '" r="13"/>';
        if (i === pts.length - 1) g += '<text class="lbl" x="' + Math.min(x(p.x), L + pw - 14) + '" y="' + (y(p.v) - 9) + '" text-anchor="middle">' + p.v.toFixed(1) + '</text>';
      });
    }
    let h = '<div class="legend"><span><i class="ln"></i>Logged</span><span><i class="tg"></i>Target: ' + WEIGHT_START + ' to ' + WEIGHT_GOAL + ' kg</span></div><div class="chart"><svg viewBox="0 0 ' + Wd + ' ' + H + '" role="group" aria-label="Body weight against target">' + g + '</svg></div>';

    else h += '<details class="bd"><summary>Show as a table' + icon('right') + '</summary><div class="scroll"><table class="tv"><thead><tr><th>Date</th><th>Weight</th><th>Target</th></tr></thead><tbody>' + pts.slice().reverse().map(p => '<tr><td>' + fmtShort(p.d) + '</td><td>' + p.v.toFixed(1) + ' kg</td><td>' + weightTarget(p.d).toFixed(1) + ' kg</td></tr>').join('') + '</tbody></table></div></details>';
    return h;
  }

  /* ---------- sheets ---------- */

    for (let d = 1; d <= days; d++) {
      const ds = y + '-' + pad(mo + 1) + '-' + pad(d), list = sessionsFor(ds);
      const on = selWeek ? mondayOf(ds) === selWeek : ds === S.sel;
      h += '<button type="button" data-act="calPick" data-d="' + ds + '" aria-pressed="' + on + '" class="' + (list ? 'in' : 'off') + (ds === t ? ' today' : '') + '" aria-label="' + fmtShort(ds) + '">' + d + '<span class="marks">' + (list ? typeMarks(list) : '') + '</span></button>';
    }
    h += '</div><div class="legend" style="margin:0"><span><i style="background:var(--run);width:8px;height:8px;border-radius:50%"></i>Run</span><span><i style="background:var(--gym);width:8px;height:8px;border-radius:50%"></i>Gym</span><span><i style="background:var(--walk);width:8px;height:8px;border-radius:50%"></i>Incline walk</span></div>' +
      '<div class="btnrow"><button type="button" class="btn" data-act="calPick" data-d="' + t + '">Today</button><button type="button" class="btn" data-act="calPick" data-d="' + START + '">Week 1</button><button type="button" class="btn" data-act="calPick" data-d="' + END + '">Race day</button></div>';
    return h;
  }
  function sheetExport() {
    const n = weekOf(S.wk), T = S.user.times;
    const row = (k, label) => '<label for="time-' + k + '">' + label + '</label><input id="time-' + k + '" type="time" data-time="' + k + '" value="' + T[k] + '">';
    return '<div class="shead"><h2>Add to calendar</h2><button type="button" class="ib" data-act="close" aria-label="Close">' + icon('x') + '</button></div>' +
      '<p class="muted">Every event carries the full session: distance, targets, warm-up, main set and cool-down. Times are Hong Kong time.</p>' +
      '<p class="eyebrow">Start times</p><div class="times">' + row('gym', 'Gym days (Mon, Wed)') + row('run', 'Weekday runs') + row('long', 'Friday long run') + row('sat', 'Saturday, after class') + row('race', 'Half marathon') + '</div>' +
      '<div class="btnrow">' + (n ? '<button type="button" class="btn primary" data-act="dl" data-scope="week">' + icon('down') + 'Week ' + n + ' (.ics)</button>' : '') + '<button type="button" class="btn" data-act="dl" data-scope="all">' + icon('down') + 'All 16 weeks (.ics)</button></div>' +
      '<p class="small">The .ics file arrives inside a .zip, because that is the file type this page is allowed to save. Unzip it, then open the .ics on your phone, or in Google Calendar on a computer choose Settings, Import and export. For a single session, use the Add to Google Calendar link on its card. Moved days are exported where you moved them.</p>';
  }
  function renderSheet() {
    const host = $('#sheetHost');
    if (!S.sheet) { host.innerHTML = ''; return; }
    host.innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + (S.sheet === 'cal' ? 'Calendar' : 'Add to calendar') + '">' + (S.sheet === 'cal' ? sheetCal() : sheetExport()) + '</div></div>';
  }

  function render() {
    renderWhere(); renderTabs();
    $('#view').innerHTML = S.tab === 'week' ? viewWeek() : S.tab === 'food' ? viewFood() : S.tab === 'plan' ? viewPlan() : viewDay();
    renderSheet();
  }

  /* ---------- actions ---------- */
  function go(tab, top) { S.tab = tab; try { history.replaceState(null, '', '#' + tab); } catch (e) { /* ignore */ } render(); if (top) window.scrollTo(0, 0); }
  function selectDate(d) { S.sel = d; S.wk = mondayOf(d); }
  function plainDownload(filename, text, type) {
    const url = URL.createObjectURL(new Blob([text], { type: type }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function backup() {
    const text = JSON.stringify({ app: 'road-to-21.1', saved: realToday(), user: S.user }, null, 1), name = 'road-to-21.1-progress-' + realToday() + '.json';
    let dl = null;
    try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) { try { await dl.save({ filename: name, data: text }); toast('Progress saved to a file.'); } catch (e) { toast(e && e.code === 'declined' ? 'Save cancelled.' : 'This view could not save the file.'); } return; }
    if (!window.claude) { plainDownload(name, text, 'application/json'); toast('Progress saved to a file.'); return; }
    toast('Saving files is not available in this view.');
  }
  function restore(file) {
    const rd = new FileReader();
    rd.onload = function () {
      try {
        const o = JSON.parse(rd.result), u = sanitize(o && o.user ? o.user : o);
        if (!hasData(u)) { toast('That file has no progress in it.'); return; }
        S.user = u; save(); render(); toast('Progress restored.');
      } catch (e) { toast('That file is not a Road to 21.1 backup.'); }
    };
    rd.readAsText(file);
  }
  async function download(scope) {
    const days = [];
    if (scope === 'week') for (let i = 0; i < 7; i++) days.push(addDays(S.wk, i)); else for (let d = START; d <= END; d = addDays(d, 1)) days.push(d);
    const ics = buildIcs(days.map(d => ({ date: d, list: sessionsFor(d) })), S.user.times, 'Road to 21.1');
    const name = scope === 'week' ? 'road-to-21.1-week-' + weekOf(S.wk) : 'road-to-21.1-all-weeks';
    let dl = null;
    try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (!dl && !window.claude) { plainDownload(name + '.ics', ics, 'text/calendar'); toast('Calendar file saved. Open it to add the sessions.'); return; }
    if (!dl) { toast('Saving files is not available in this view. Use the Add to Google Calendar link on each session.'); return; }
    try { await dl.save({ filename: name + '.zip', data: zipStore(name + '.ics', new TextEncoder().encode(ics)) }); toast('Saved. Unzip it, then open the .ics file.'); }
    catch (e) { const c = e && e.code; toast(c === 'declined' ? 'Download cancelled.' : c === 'rate_limited' ? 'A save prompt is already open.' : 'This view could not save the file.'); }
  }
  document.addEventListener('click', function (e) {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act, d = el.dataset.d;
    if (a === 'scrim') { if (e.target === el) { S.sheet = null; renderSheet(); } return; }
    switch (a) {
      case 'tab': S.swap = null; go(el.dataset.tab, true); break;
      case 'pickDay': selectDate(d); render(); break;
      case 'goto': S.swap = null; selectDate(d); go('today', true); break;
      case 'shiftDay': selectDate(addDays(S.sel, +el.dataset.n)); render(); break;
      case 'shiftWeek': S.swap = null; S.wk = addDays(S.wk, 7 * +el.dataset.n); S.sel = S.wk; render(); break;
      case 'thisWeek': S.swap = null; selectDate(realToday()); render(); break;
      case 'cal': S.calMonth = (S.tab === 'week' ? S.wk : S.sel).slice(0, 7); S.sheet = 'cal'; renderSheet(); break;
      case 'calShift': { const dt = new Date(+S.calMonth.slice(0, 4), +S.calMonth.slice(5, 7) - 1 + +el.dataset.n, 1); S.calMonth = toYmd(dt).slice(0, 7); renderSheet(); break; }
      case 'calPick': S.sheet = null; S.swap = null; selectDate(d); render(); break;
      case 'close': S.sheet = null; renderSheet(); break;
      case 'done': { const id = el.dataset.id; if (S.user.done[id]) delete S.user.done[id]; else S.user.done[id] = true; save(); render(); break; }
      case 'swapFrom': if (!sessionsFor(d)) break; S.swap = d; S.wk = mondayOf(d); go('week', S.tab !== 'week'); break;
      case 'swapTo': { const from = S.swap; S.swap = null; swapDays(from, d); save(); render(); toast('Swapped ' + DOW_LONG[fromYmd(from).getDay()] + ' and ' + DOW_LONG[fromYmd(d).getDay()] + '.'); break; }
      case 'swapCancel': S.swap = null; render(); break;
      case 'resetWeek': for (let i = 0; i < 7; i++) delete S.user.src[addDays(S.wk, i)]; save(); render(); toast('Week restored to the original order.'); break;
      case 'export': S.sheet = 'export'; renderSheet(); break;
      case 'dl': download(el.dataset.scope); break;
      case 'food': S.food = el.dataset.f; render(); break;
      case 'clearWeight': delete S.user.weights[S.sel]; save(); render(); break;
      case 'backup': backup(); break;
      case 'clearTicks': S.ticks = {}; try { localStorage.removeItem(LS_TICKS); } catch (er) { /* ignore */ } render(); break;
    }
  });
  document.addEventListener('submit', function (e) {
    const f = e.target.closest('[data-form="weigh"]'); if (!f) return;
    e.preventDefault();
    const v = parseFloat(f.querySelector('input').value);
    if (!(v > 30 && v < 200)) { toast('Enter a weight in kilograms, for example 72.4.'); return; }
    S.user.weights[S.sel] = Math.round(v * 10) / 10; save(); render(); toast('Saved ' + S.user.weights[S.sel].toFixed(1) + ' kg for ' + fmtShort(S.sel) + '.');
  });
  document.addEventListener('change', function (e) {
    const el = e.target;
    if (el.id === 'restore-file' && el.files && el.files[0]) { restore(el.files[0]); el.value = ''; return; }
    if (el.dataset && el.dataset.tick) { if (el.checked) S.ticks[el.dataset.tick] = 1; else delete S.ticks[el.dataset.tick]; try { localStorage.setItem(LS_TICKS, JSON.stringify(S.ticks)); } catch (er) { /* ignore */ } }
    else if (el.dataset && el.dataset.time && /^\d\d:\d\d$/.test(el.value)) { S.user.times[el.dataset.time] = el.value; save(); if (S.tab === 'today') $('#view').innerHTML = viewDay(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) { S.sheet = null; renderSheet(); } });
  /* chart tooltips */
  const tip = $('#tip');
  function showTip(el, x, y) {
    tip.textContent = ''; const b = document.createElement('b'); b.textContent = el.dataset.tip; tip.appendChild(b); tip.appendChild(document.createTextNode(el.dataset.tip2 || ''));
    tip.hidden = false;
    const r = tip.getBoundingClientRect(), vw = document.documentElement.clientWidth;
    tip.style.left = Math.max(8, Math.min(vw - r.width - 8, x - r.width / 2)) + 'px'; tip.style.top = Math.max(8, y - r.height - 12) + 'px';
  }
  document.addEventListener('pointermove', function (e) { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else if (!tip.hidden) tip.hidden = true; });
  document.addEventListener('focusin', function (e) { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top + 20); } });
  document.addEventListener('focusout', function () { tip.hidden = true; });
  window.addEventListener('scroll', function () { tip.hidden = true; }, { passive: true });

  /* ---------- boot ---------- */
  loadLocal();
  const hash = (location.hash || '').replace('#', '');
  if (['today', 'week', 'food', 'plan'].indexOf(hash) >= 0) S.tab = hash;
  render();
  initCloud();
  if (!window.claude && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache optional */ });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !S.sheet) renderWhere(); });
})();
</script>
</body></html>
